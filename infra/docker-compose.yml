# infra/docker-compose.yml — volledige lokale stack:
#   Postgres + Redis + MinIO + API + Celery-worker + Celery-beat.
#
# Draaien (vanaf de repo-root, of uit infra/):
#   docker compose -f infra/docker-compose.yml up --build
#
# Daarna: http://localhost:8080/docs (API), http://localhost:9001 (MinIO-console).
#
# Bewuste keuzes:
# * Eén image (infra/Dockerfile) voor api/worker/beat — dezelfde lockfile,
#   alleen het command verschilt. Voorkomt "werkt op mijn machine"-verschillen.
# * De API voert `alembic upgrade head` vóór uvicorn uit; worker en beat
#   starten pas als de API gezond is (en dus de tabellen bestaan).
# * Sweeper-interval kort gezet (20 s i.p.v. 300 s) zodat `beat` in een
#   demo-observabel is; de instellingen komen uit de gewone Settings.
# * vLLM/GPU zit er bewust niet in — de vlm-stage is optioneel.

name: elektro-ai

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://elektro:elektro@db:5432/elektro
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: elektro-uploads
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  # Dev-gekalibreerd zodat de sweeper in seconden waarneembaar is.
  STALE_CHECK_SECONDS: "20"
  STALE_AFTER_MINUTES: "15"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elektro
      POSTGRES_PASSWORD: elektro
      POSTGRES_DB: elektro
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elektro -d elektro"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: sh -c "alembic upgrade head && exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8080"
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A apps.worker.celery_app worker --loglevel=info --concurrency=2
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: celery -A apps.worker.celery_app beat --loglevel=info
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
  minio-data:

# Configuration for Qwen-VL Fine-Tuning with LoRA/QLoRA
# imjan AI — Vision-Language Model for Electrical Blueprints

model:
  base_model: "Qwen/Qwen2.5-VL-7B-Instruct"
  fallback_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  torch_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  load_in_4bit: true          # QLoRA: 4-bit NormalFloat
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

data:
  train_file: "ml/data/vlm/train.jsonl"
  val_file: "ml/data/vlm/val.jsonl"
  max_seq_length: 4096
  image_resolution: 1024

training:
  epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 50
  save_total_limit: 2
  seed: 42
  gradient_checkpointing: true
  fp16: false
  bf16: true

tracking:
  experiment_name: "qwen-vl-lora"
  tracker: "mlflow"
  export_merged: true

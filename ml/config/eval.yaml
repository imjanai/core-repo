# Evaluation and Model Promotion Gate Configuration
# imjan AI — 4-Level Evaluation Framework

evaluation:
  dataset_path: "ml/data/golden"
  batch_size: 1
  device: "auto"
  raster_tolerance_px: 12
  vector_tolerance_mm: 100

gates:
  # Level 1: Detection Gates
  min_symbol_f1: 0.85
  max_symbol_f1_drop: 0.00

  # Level 2: Counting Gates
  max_avg_count_error: 1.5    # Max 1.5 missing/extra symbols per blueprint
  min_perfect_drawings_pct: 50.0  # At least 50% blueprints with 0 count error

  # Level 3: Outcome (Material Bill) Gates
  max_cost_error_pct: 2.5     # Material total price within 2.5% of ground truth
  max_quantity_error_pct: 3.0

  # Level 4: Review Workflow Gates
  min_zero_correction_pct: 40.0
  max_avg_corrections: 2.0

reporting:
  output_markdown: "eval-rapport.md"
  output_json: "eval-metrics.json"
  mlflow_logging: true
